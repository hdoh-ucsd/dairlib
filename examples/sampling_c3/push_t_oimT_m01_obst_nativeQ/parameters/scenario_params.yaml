# Single-obstacle scenario (OIM benchmark family): the source scene's static
# 0.1 m cube at the start->goal midpoint. Obstacles are planar discs
# [x, y, radius]; radius circumscribes the square footprint.
scenario_name: single_obstacle
obstacles:
  - [0.5, 0.0, 0.0707]
obstacle_cost_weight: 5000.0
# Three-zone tuning (w=5000, decay=0.04): negligible at the start
# (clearance 0.23 -> ~100/sample), steering at the doorstep (5 cm ->
# ~8.6k with ~2k/cm lateral sensitivity), vetoing at contact (~30k).
# decay 0.02 was veto-only (flat mid-field); decay 0.06 at w=20000 taxed
# the start region and froze all approach (measured: zero object motion,
# unsuccessful-sample buffer overflow).
obstacle_cost_decay: 0.04
obstacle_model: examples/sampling_c3/urdf/single_obstacle_box.sdf
